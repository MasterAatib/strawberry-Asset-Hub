    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0d1117;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .main-scroll {
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .main-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .main-scroll::-webkit-scrollbar-thumb {
            background: #ff2e55;
            border-radius: 20px;
        }
        .main-scroll::-webkit-scrollbar-track {
            background: #161b22;
        }

        /* ─── HEADER ─── */
        header {
            background: #111827;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .logo span {
            color: #ff2e55;
            font-size: 36px;
            font-weight: bold;
        }
        .logo-icon {
            height: 62px;
            width: auto;
            vertical-align: middle;
        }

        .search-box {
            display: flex;
            width: 380px;
            max-width: 100%;
        }
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            outline: none;
            background: #1f2937;
            color: white;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
        }
        .search-box button {
            padding: 12px 20px;
            border: none;
            background: #ff2e55;
            color: white;
            cursor: pointer;
            font-weight: bold;
            border-radius: 0 8px 8px 0;
            transition: background 0.2s;
        }
        .search-box button:hover {
            background: #e0294c;
        }

        /* ─── NAV ─── */
        nav {
            background: #161b22;
            padding: 12px 5%;
            display: flex;
            gap: 25px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        nav a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }
        nav a:hover {
            color: #ff2e55;
            border-bottom-color: #ff2e55;
        }
        nav a.active {
            color: #ff2e55;
            border-bottom-color: #ff2e55;
        }

        /* ─── FILTER + SORT BAR ─── */
        .control-bar {
            padding: 20px 5% 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 20px;
            border-bottom: 1px solid #222a33;
            margin-bottom: 10px;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1 1 auto;
        }

        .filter-btn {
            padding: 8px 18px;
            background: #161b22;
            border: 1px solid #2d333b;
            color: #b0b8c4;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 14px;
        }
        .filter-btn:hover {
            background: #ff2e55;
            border-color: #ff2e55;
            color: #fff;
        }
        .filter-btn.active {
            background: #ff2e55;
            border-color: #ff2e55;
            color: #fff;
        }

        .sort-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .sort-group label {
            color: #9ca3af;
            font-size: 14px;
            font-weight: 500;
        }
        .sort-group select {
            padding: 8px 14px;
            background: #161b22;
            border: 1px solid #2d333b;
            color: white;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        .sort-group select:hover {
            border-color: #ff2e55;
        }

        .clear-btn {
            padding: 8px 18px;
            background: transparent;
            border: 1px solid #5865f2;
            color: #5865f2;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            font-size: 14px;
        }
        .clear-btn:hover {
            background: #5865f2;
            color: white;
        }

        .asset-count {
            color: #9ca3af;
            font-size: 14px;
            padding: 4px 0;
            white-space: nowrap;
        }

        /* ─── SECTION TITLE ─── */
        .section-title {
            padding: 10px 5% 16px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title small {
            font-size: 16px;
            font-weight: 400;
            color: #9ca3af;
            letter-spacing: 0;
        }

        /* ─── PRODUCT GRID ─── */
        .products {
            padding: 0 5% 50px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .card {
            background: #161b22;
            border: 1px solid #2d333b;
            border-radius: 18px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.2s, border-color 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            border-color: #ff2e5540;
        }
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 46, 85, 0.06));
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            border-radius: 18px;
        }
        .card:hover::before {
            opacity: 1;
        }

        .preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #0a0f16;
            transition: 0.2s;
        }

        /* Skeleton loading */
        .skeleton-card {
            background: #161b22;
            border: 1px solid #2d333b;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 340px;
        }
        .skeleton-preview {
            height: 200px;
            background: #1a1f2b;
            animation: shimmer 1.2s infinite;
            background-size: 200% 100%;
            background-image: linear-gradient(90deg, #1a1f2b 25%, #2a3344 50%, #1a1f2b 75%);
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-line {
            height: 16px;
            background: #1a1f2b;
            margin: 12px 18px;
            border-radius: 8px;
        }
        .skeleton-line.short {
            width: 60%;
        }
        .skeleton-line.tag {
            width: 40%;
            height: 24px;
            border-radius: 30px;
        }

        .card-content {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .category {
            color: #9ca3af;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .price-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .price-badge.free {
            background: #0d7a3e;
            color: #8bffb0;
        }
        .price-badge.paid {
            background: #7a2e3a;
            color: #ff8a9a;
        }

        .asset-name {
            font-size: 20px;
            font-weight: bold;
            margin: 6px 0 8px;
        }

        /* Asset meta: engine, format, license */
        .asset-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .meta-tag {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #2d333b;
        }
        .meta-tag.license {
            background: #1f2937;
            border-color: #f7c948;
            color: #f7c948;
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            width: fit-content;
            margin-bottom: 12px;
            background: #ff2e55;
            color: white;
        }
        .tag-badge.free {
            background: #0d7a3e;
            color: #8bffb0;
        }
        .tag-badge.premium {
            background: #7a2e3a;
            color: #ff8a9a;
        }
        .tag-badge.popular {
            background: #b45309;
            color: #fde68a;
        }
        .tag-badge.new {
            background: #1e40af;
            color: #93c5fd;
        }
        .tag-badge.limited {
            background: #991b1b;
            color: #fca5a5;
        }
        .tag-badge.top-rated {
            background: #6b21a5;
            color: #d8b4fe;
        }
        .tag-badge.community {
            background: #065f46;
            color: #6ee7b7;
        }
        .tag-badge.featured {
            background: #d97706;
            color: #fef3c7;
        }

        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
            flex: 1 1 auto;
            min-width: 80px;
            text-align: center;
        }
        .btn:hover {
            transform: scale(1.02);
        }

        .btn-view {
            background: #ff2e55;
            color: #fff;
        }
        .btn-view:hover {
            background: #c82345;
        }

        .btn-buy-inr {
            background: #1f8b4c;
            color: #fff;
        }
        .btn-buy-inr:hover {
            background: #16733e;
        }

        .btn-buy-usd {
            background: #2563eb;
            color: #fff;
        }
        .btn-buy-usd:hover {
            background: #1d4ed8;
        }

        .btn-buy-inr.paid,
        .btn-buy-usd.paid {
            flex: 1 1 40%;
        }

        /* ─── EMPTY STATE ─── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
        .empty-state .emoji {
            font-size: 56px;
            display: block;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 6px;
        }

        /* ─── BACK TO TOP ─── */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #ff2e55;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,46,85,0.4);
            transition: opacity 0.3s, transform 0.2s;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
        }
        .back-to-top.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .back-to-top:hover {
            transform: scale(1.1);
            background: #e0294c;
        }

        /* ─── FOOTER ─── */
        footer {
            background: #111827;
            padding: 28px 5% 20px;
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            border-top: 1px solid #1f2937;
        }
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
        }
        .footer-links a {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: #ff2e55;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 1024px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            body {
                overflow: auto;
            }
            .main-scroll {
                height: auto;
                overflow-y: visible;
            }

            header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 16px 5%;
                gap: 12px;
            }
            .logo {
                justify-content: center;
                font-size: 28px;
            }
            .logo span {
                font-size: 30px;
            }
            .logo-icon {
                height: 36px;
            }
            .search-box {
                width: 100%;
            }
            .search-box input {
                padding: 14px 16px;
                font-size: 16px;
            }
            .search-box button {
                padding: 14px 20px;
            }

            nav {
                gap: 20px;
                padding: 12px 5%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            nav a {
                font-size: 15px;
            }

            .control-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                padding: 16px 4% 10px;
            }
            .filter-group {
                justify-content: center;
            }
            .sort-group {
                margin-left: 0;
                justify-content: center;
            }
            .asset-count {
                text-align: center;
            }
            .clear-btn {
                font-size: 14px;
                padding: 6px 16px;
            }

            .section-title {
                font-size: 24px;
                padding: 8px 4% 12px;
                flex-wrap: wrap;
            }
            .section-title small {
                font-size: 14px;
            }

            .products {
                padding: 0 4% 40px;
                gap: 20px;
                grid-template-columns: 1fr;
            }
            .preview {
                height: 180px;
            }
            .asset-name {
                font-size: 19px;
            }
            .card-content {
                padding: 16px;
            }
            .card-actions {
                flex-wrap: wrap;
            }
            .btn {
                font-size: 13px;
                padding: 10px 14px;
                flex: 1 1 100%;
            }
            .btn-buy-inr.paid,
            .btn-buy-usd.paid {
                flex: 1 1 45%;
            }
            .footer-links {
                gap: 14px;
                font-size: 13px;
            }
            .back-to-top {
                bottom: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .filter-btn {
                padding: 6px 14px;
                font-size: 13px;
            }
            .sort-group select {
                padding: 6px 12px;
                font-size: 13px;
            }
            .section-title {
                font-size: 22px;
            }
            .preview {
                height: 160px;
            }
            .asset-name {
                font-size: 17px;
            }
            .btn {
                font-size: 12px;
                padding: 9px 12px;
            }
        }
    </style>
</head>

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RENDER ENGINE with FUSE.JS fuzzy search
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const container = document.getElementById("productContainer");
        const countEl = document.getElementById("assetCount");
        const searchInput = document.getElementById("searchInput");
        const sortSelect = document.getElementById("sortSelect");
        const filterBtns = document.querySelectorAll('.filter-btn');
        const backToTop = document.getElementById('backToTop');
        const scrollEl = document.getElementById('mainScroll');

        let currentFilter = "All";
        let currentSearch = "";
        let currentSort = "default";

        // ── Load saved state ──
        function loadState() {
            const savedFilter = localStorage.getItem('strawberry_explore_filter');
            if (savedFilter) currentFilter = savedFilter;
            const savedSort = localStorage.getItem('strawberry_explore_sort');
            if (savedSort) currentSort = savedSort;
            filterBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === currentFilter);
            });
            sortSelect.value = currentSort;
        }

        function saveState() {
            localStorage.setItem('strawberry_explore_filter', currentFilter);
            localStorage.setItem('strawberry_explore_sort', currentSort);
        }

        // ── Fuse.js setup ──
        const fuseOptions = {
            keys: ['name', 'category', 'tag', 'engine', 'fileFormat', 'license'],
            threshold: 0.3, // fuzzy match
            includeScore: false,
        };
        let fuse = new Fuse(assets, fuseOptions);

        function getFilteredAssets() {
            let list = [...assets];

            // Category filter
            if (currentFilter !== "All") {
                list = list.filter(a => a.category === currentFilter);
            }

            // Fuzzy search
            if (currentSearch.trim() !== "") {
                const result = fuse.search(currentSearch.trim());
                list = result.map(r => r.item);
            }

            // Sort
            const sortVal = sortSelect.value;
            switch (sortVal) {
                case "name-asc":
                    list.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case "name-desc":
                    list.sort((a, b) => b.name.localeCompare(a.name));
                    break;
                case "price-asc":
                    list.sort((a, b) => a.priceUSD - b.priceUSD);
                    break;
                case "price-desc":
                    list.sort((a, b) => b.priceUSD - a.priceUSD);
                    break;
                default:
                    break;
            }
            return list;
        }

        function getBadgeClass(tag) {
            const lower = tag.toLowerCase();
            if (lower.includes('free')) return 'free';
            if (lower.includes('premium')) return 'premium';
            if (lower.includes('popular')) return 'popular';
            if (lower.includes('new')) return 'new';
            if (lower.includes('limited')) return 'limited';
            if (lower.includes('top rated')) return 'top-rated';
            if (lower.includes('community')) return 'community';
            return '';
        }

        function renderAssets(list) {
            if (!container) return;
            container.innerHTML = "";

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="emoji">🍓</span>
                        <h3>No assets found</h3>
                        <p>Try adjusting your filters or search terms.</p>
                    </div>
                `;
                countEl.textContent = "0 assets";
                return;
            }

            countEl.textContent = `${list.length} asset${list.length > 1 ? 's' : ''}`;

            list.forEach(asset => {
                const card = document.createElement("div");
                card.className = "card";

                const isFree = asset.type === "free";
                const thumbSrc = asset.thumbnail || "https://placehold.co/400x200/1f2937/ff2e55?text=🍓+Asset";

                let actionsHTML = "";
                if (isFree) {
                    actionsHTML = `
                        <a href="${asset.link || '#'}" target="_blank" class="btn btn-view">👁️ View Asset</a>
                    `;
                } else {
                    const inrLink = asset.linkINR || '#';
                    const usdLink = asset.linkUSD || '#';
                    actionsHTML = `
                        <a href="${inrLink}" target="_blank" class="btn btn-buy-inr paid">₹ ${asset.priceINR}</a>
                        <a href="${usdLink}" target="_blank" class="btn btn-buy-usd paid">$ ${asset.priceUSD.toFixed(2)}</a>
                    `;
                }

                const badgeClass = isFree ? "free" : "paid";
                const badgeLabel = isFree ? "🆓 Free" : "💳 Paid";
                const tagClass = getBadgeClass(asset.tag);
                const featuredClass = asset.featured ? 'featured' : '';

                // Engine, format, license
                const engineLabel = asset.engine || 'Any';
                const formatLabel = asset.fileFormat || 'N/A';
                const licenseLabel = asset.license || 'N/A';

                card.innerHTML = `
                    <img class="preview" src="${thumbSrc}" loading="lazy" onerror="this.src='https://placehold.co/400x200/1f2937/ff2e55?text=🍓+Asset'" />
                    <div class="card-content">
                        <div class="card-top">
                            <span class="category">📁 ${asset.category}</span>
                            <span class="price-badge ${badgeClass}">${badgeLabel}</span>
                        </div>
                        <div class="asset-name">${asset.name}</div>
                        <div class="asset-meta">
                            <span class="meta-tag">⚙️ ${engineLabel}</span>
                            <span class="meta-tag">📄 ${formatLabel}</span>
                            <span class="meta-tag license">📜 ${licenseLabel}</span>
                        </div>
                        <span class="tag-badge ${tagClass} ${featuredClass}">${asset.tag}</span>
                        <div class="card-actions">
                            ${actionsHTML}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ── Show skeletons ──
        function showSkeletons() {
            container.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton-card';
                skeleton.innerHTML = `
                    <div class="skeleton-preview"></div>
                    <div class="skeleton-line" style="width:40%; margin-top:16px;"></div>
                    <div class="skeleton-line" style="width:70%;"></div>
                    <div class="skeleton-line tag"></div>
                    <div class="skeleton-line" style="width:100%; height:44px; margin-top:auto;"></div>
                `;
                container.appendChild(skeleton);
            }
        }

        function updateUI() {
            saveState();
            const filtered = getFilteredAssets();
            renderAssets(filtered);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  FILTER + SEARCH + SORT HANDLERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        filterBtns.forEach(btn => {
            btn.addEventListener("click", function() {
                filterBtns.forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                currentFilter = this.dataset.filter;
                updateUI();
            });
        });

        function searchAssets() {
            currentSearch = searchInput.value;
            updateUI();
        }

        searchInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                searchAssets();
            }
        });

        sortSelect.addEventListener("change", function() {
            currentSort = this.value;
            updateUI();
        });

        function clearFilters() {
            currentFilter = "All";
            currentSearch = "";
            searchInput.value = "";
            filterBtns.forEach(b => b.classList.remove("active"));
            document.querySelector('.filter-btn[data-filter="All"]').classList.add("active");
            updateUI();
        }

        // ── Back to Top visibility ──
        scrollEl.addEventListener('scroll', function() {
            if (this.scrollTop > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        loadState();
        showSkeletons();
        setTimeout(() => {
            updateUI();
        }, 400);

        // expose to global
        window.searchAssets = searchAssets;
        window.clearFilters = clearFilters;
    </script>
